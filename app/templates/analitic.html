<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Финансовый трекер</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
        body
        {
            background-image: url('/img/2.png');
            background-size: contain;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .user, .chart-card, .link
        {
            border: 2px solid #007bff;
            border-radius: 30px;
            width: 600px;
            background-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* тень */
            padding: 20px;
            margin-bottom: 20px;
        }

        .user
        {
            padding: 20px;
            width: 300px;
        }

        img
        {
            max-width: 500px;
        }
    </style>
</head>
<body>
    <h1>Аналитика</h1>
    <h3 class = 'user'>Пользователь {{ user.username }}</h3>
    <div class = 'charts'>
        <section class = 'chart-card'>
            <h2>Доходы и расходы по категориям</h2>
            <img src = '/analitic/bar.png'>
        </section>
        <section class = 'chart-card'>
            <h2>Доходы и расходы</h2>
            <img src = '/analitic/pie.png'>
        </section>
        <section class = 'chart-card'>
            <h2>Изменение баланса</h2>
            <img src = '/analitic/balance.png'>
        </section>
    </div>
    <div class = 'link'>
        <a href = '/transaction/add'>Операции</a><br>
        <a href = '/category'>Категории</a><br>
        <a href = '/'>На главную</a><br>
        <a href = '/logout'>Выйти</a>
    </div>
</body>
</html>
